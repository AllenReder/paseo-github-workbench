name: Bug report
description: Report a reproducible problem in GitHub Workbench.
title: "Bug: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, private repository names, private URLs, or local paths.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect GitHub Workbench to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Refresh ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Paseo version, plugin commit/version, operating system, and GitHub CLI version.
    validations:
      required: true
